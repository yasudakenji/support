services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: "${SUPPORT_DB_NAME:-support}"
      POSTGRES_USER: "${SUPPORT_DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${SUPPORT_DB_PASSWORD:?Defina SUPPORT_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${SUPPORT_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./banco/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
